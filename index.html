<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Músicas Sertanejas</title>

    <!-- Etiquetas Open Graph para o cartão limpo no WhatsApp -->
    <meta property="og:title" content="Músicas Sertanejas">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-cyan-glow: rgba(0, 240, 255, 0.45);
            --amber-gold: #ffaa44;
            --amber-glow: rgba(255, 170, 68, 0.4);
            --text-main: #ffffff;
            --text-muted: #b89f8d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #160a04;
            background-image: 
                radial-gradient(circle at 50% 35%, rgba(62, 30, 12, 0.55) 0%, rgba(12, 5, 2, 0.92) 85%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.015) 0px,
                    rgba(255, 255, 255, 0.015) 1px,
                    transparent 1px,
                    transparent 4px,
                    rgba(0, 0, 0, 0.25) 4px,
                    rgba(0, 0, 0, 0.25) 7px
                ),
                linear-gradient(90deg, #1b0d06 0%, #2d160a 25%, #1f0e06 50%, #2a1409 75%, #160a04 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .circuit-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
        }

        .player-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            max-height: 860px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(12px, 2.5vh, 22px) 20px clamp(14px, 2.8vh, 24px);
        }

        @media (min-width: 520px) {
            .player-shell {
                height: 94dvh;
                border-radius: 28px;
                background: rgba(18, 9, 4, 0.55);
                backdrop-filter: blur(6px);
                border: 1px solid rgba(0, 240, 255, 0.16);
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 240, 255, 0.08);
            }
        }

        .top-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1.2vh, 12px);
            flex-shrink: 0;
        }

        .site-logo {
            width: clamp(54px, 8.5vh, 74px);
            height: clamp(54px, 8.5vh, 74px);
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 18px var(--neon-cyan-glow);
        }

        .site-title {
            font-size: clamp(1.1rem, 2.5vh, 1.35rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            color: var(--text-main);
            text-shadow: 0 0 12px var(--amber-glow);
        }

        .featured-cover-box {
            width: clamp(150px, 25vh, 225px);
            height: clamp(150px, 25vh, 225px);
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75), 0 0 22px var(--neon-cyan-glow);
            flex-shrink: 0;
        }

        .featured-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 1vh, 10px);
            flex-shrink: 0;
        }

        .track-title {
            font-size: clamp(1.15rem, 2.6vh, 1.45rem);
            font-weight: 600;
            text-align: center;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        #waveCanvas {
            width: 100%;
            height: clamp(32px, 5vh, 46px);
            display: block;
        }

        .progress-area {
            width: 100%;
            flex-shrink: 0;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            display: block;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.14);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            margin-top: -4.5px;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .controls-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            color: var(--text-main);
        }

        .ctrl-btn.nav-btn {
            color: var(--neon-cyan);
        }

        .ctrl-btn.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            background: rgba(0, 240, 255, 0.12);
        }

        .play-main-btn {
            width: clamp(54px, 7.5vh, 64px);
            height: clamp(54px, 7.5vh, 64px);
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 2.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan-glow);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-main-btn:hover {
            background: rgba(0, 240, 255, 0.22);
            transform: scale(1.05);
        }

        .playlist-strip {
            width: 100%;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 2px 8px;
            scroll-behavior: smooth;
            flex-shrink: 0;
        }

        .playlist-strip::-webkit-scrollbar {
            height: 4px;
        }

        .playlist-strip::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .playlist-strip::-webkit-scrollbar-thumb {
            background: var(--amber-gold);
            border-radius: 10px;
        }

        .song-item {
            flex: 0 0 clamp(74px, 11vh, 88px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .song-thumb {
            width: clamp(74px, 11vh, 88px);
            height: clamp(74px, 11vh, 88px);
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .song-item.active .song-thumb {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 14px var(--neon-cyan-glow);
        }

        .song-name {
            width: 100%;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-item.active .song-name {
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .volume-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .vol-btn {
            background: transparent;
            border: none;
            color: var(--amber-gold);
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            background: var(--amber-gold) !important;
            box-shadow: 0 0 10px var(--amber-glow) !important;
        }
    </style>
</head>
<body>

    <svg class="circuit-bg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#00f0ff" stroke-width="1.5" opacity="0.55">
            <path d="M0 180 H140 L175 215 H240"/>
            <circle cx="240" cy="215" r="4" fill="#00f0ff"/>
            <path d="M0 240 H110 L145 275 H210"/>
            <circle cx="210" cy="275" r="3.5"/>
            <path d="M800 200 H650 L615 235 H550"/>
            <circle cx="550" cy="235" r="4" fill="#00f0ff"/>
            <path d="M800 265 H680 L645 300 H580"/>
            <circle cx="580" cy="300" r="3.5"/>
            <path d="M0 720 H150 L190 680 H260"/>
            <circle cx="260" cy="680" r="4" fill="#00f0ff"/>
            <path d="M800 740 H640 L600 700 H530"/>
            <circle cx="530" cy="700" r="4" fill="#00f0ff"/>
        </g>
        <g stroke="#ffaa44" stroke-width="1.5" opacity="0.5">
            <path d="M0 210 H125 L160 245 H225"/>
            <circle cx="225" cy="245" r="3.5" fill="#ffaa44"/>
            <path d="M800 232 H665 L630 267 H565"/>
            <circle cx="565" cy="267" r="3.5" fill="#ffaa44"/>
            <path d="M0 755 H170 L205 720 H275"/>
            <circle cx="275" cy="720" r="3.5" fill="#ffaa44"/>
            <path d="M800 775 H620 L585 740 H515"/>
            <circle cx="515" cy="740" r="3.5" fill="#ffaa44"/>
        </g>
    </svg>

    <main class="player-shell">
        <header class="top-header">
            <img src="logo.png" onerror="this.src=fallbackLogo" alt="Logo" class="site-logo">
            <h1 class="site-title">Músicas Sertanejas</h1>
        </header>

        <div class="featured-cover-box">
            <img id="mainCover" src="" alt="Capa da Música">
        </div>

        <section class="track-info-area">
            <div class="track-title" id="trackTitle">Carregando...</div>
            <canvas id="waveCanvas" width="600" height="80"></canvas>
        </section>

        <section class="progress-area">
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
            <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
        </section>

        <section class="controls-row">
            <button class="ctrl-btn" id="shuffleBtn" title="Aleatório">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <line x1="15" y1="15" x2="21" y2="21"></line>
                    <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
            </button>

            <button class="ctrl-btn nav-btn" id="prevBtn" title="Anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
            </button>

            <button class="play-main-btn" id="playPauseBtn" title="Tocar ou Pausar">
                <svg id="playPauseSvg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>

            <button class="ctrl-btn nav-btn" id="nextBtn" title="Próxima">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>

            <button class="ctrl-btn" id="loopBtn" title="Repetir Música">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
            </button>
        </section>

        <section class="playlist-strip" id="playlistStrip"></section>

        <section class="volume-row">
            <button class="vol-btn" id="muteBtn" title="Mudo">
                <svg id="volSvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <input type="range" class="volume-slider" id="volumeBar" value="85" min="0" max="100">
        </section>
    </main>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const playlist = [
            {
                title: "A Pracinha",
                audioSrc: "musicas/musica1.mp3",
                coverSrc: "capas/capa1.jpg"
            },
            {
                title: "Eternidade",
                audioSrc: "musicas/musica2.mp3",
                coverSrc: "capas/capa2.jpg"
            },
            {
                title: "Volta pro Meu Abraço",
                audioSrc: "musicas/musica3.mp3",
                coverSrc: "capas/capa3.jpg"
            },
            {
                title: "Amor Proibido",
                audioSrc: "musicas/musica4.mp3",
                coverSrc: "capas/capa4.jpg"
            },
            {
                title: "Escolha",
                audioSrc: "musicas/musica5.mp3",
                coverSrc: "capas/capa5.jpg"
            },
            {
                title: "Teu Perfume",
                audioSrc: "musicas/musica6.mp3",
                coverSrc: "capas/capa6.jpg"
            }
        ];

        const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><circle cx='100' cy='100' r='96' fill='%23180b05' stroke='%2300f0ff' stroke-width='4'/><text x='100' y='108' font-family='sans-serif' font-size='24' font-weight='bold' fill='%2300f0ff' text-anchor='middle'>IA MUSIC</text></svg>";
        const fallbackCover = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='%23231006'/><circle cx='150' cy='150' r='85' fill='none' stroke='%2300f0ff' stroke-width='3'/><text x='150' y='156' font-family='sans-serif' font-size='20' fill='%23ffaa44' text-anchor='middle'>SERTANEJO</text></svg>";

        const audio = document.getElementById('audioPlayer');
        const mainCover = document.getElementById('mainCover');
        const trackTitle = document.getElementById('trackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseSvg = document.getElementById('playPauseSvg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');
        const playlistStrip = document.getElementById('playlistStrip');
        const volumeBar = document.getElementById('volumeBar');
        const muteBtn = document.getElementById('muteBtn');
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isLoop = false;

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let webAudioReady = false;
        let phase = 0;

        const playIcon = `<path d="M8 5v14l11-7z"/>`;
        const pauseIcon = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

        function setupAudioAnalyser() {
            if (audioCtx) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                const source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                webAudioReady = true;
            } catch (e) {
                webAudioReady = false;
            }
        }

        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);

            const grad = ctx.createLinearGradient(0, 0, width, 0);
            grad.addColorStop(0, '#ffaa44');
            grad.addColorStop(0.5, '#7de2d1');
            grad.addColorStop(1, '#00f0ff');

            ctx.fillStyle = grad;
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';

            if (isPlaying && webAudioReady && analyser) {
                analyser.getByteFrequencyData(dataArray);
            }

            phase += isPlaying ? 0.08 : 0.01;

            const points = 60;
            const step = width / points;

            ctx.beginPath();
            ctx.moveTo(0, centerY);

            for (let i = 0; i <= points; i++) {
                const x = i * step;
                const edgeFade = Math.sin((i / points) * Math.PI);
                let amp = 2;

                if (isPlaying) {
                    if (webAudioReady && dataArray && dataArray[0] > 0) {
                        const freqIndex = Math.floor((i / points) * (dataArray.length * 0.6));
                        amp = (dataArray[freqIndex] / 255) * (height * 0.44);
                    } else {
                        amp = (Math.sin(i * 0.35 + phase) * 0.5 + 0.5) * (height * 0.36);
                    }
                }

                const y = centerY - Math.max(1.5, amp * edgeFade);
                ctx.lineTo(x, y);
            }

            for (let i = points; i >= 0; i--) {
                const x = i * step;
                const edgeFade = Math.sin((i / points) * Math.PI);
                let amp = 2;

                if (isPlaying) {
                    if (webAudioReady && dataArray && dataArray[0] > 0) {
                        const freqIndex = Math.floor((i / points) * (dataArray.length * 0.6));
                        amp = (dataArray[freqIndex] / 255) * (height * 0.44);
                    } else {
                        amp = (Math.sin(i * 0.35 + phase) * 0.5 + 0.5) * (height * 0.36);
                    }
                }

                const y = centerY + Math.max(1.5, amp * edgeFade);
                ctx.lineTo(x, y);
            }

            ctx.closePath();
            ctx.globalAlpha = 0.35;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.stroke();
        }

        function formatTime(sec) {
            if (isNaN(sec) || !isFinite(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderPlaylist() {
            playlistStrip.innerHTML = '';
            playlist.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${song.coverSrc}" onerror="this.src=fallbackCover" class="song-thumb" alt="${song.title}">
                    <span class="song-name">${song.title}</span>
                `;
                item.addEventListener('click', () => {
                    loadSong(idx, true);
                });
                playlistStrip.appendChild(item);
            });
        }

        function loadSong(index, autoPlay = false) {
            currentIndex = index;
            const song = playlist[currentIndex];
            trackTitle.textContent = song.title;
            mainCover.src = song.coverSrc;
            mainCover.onerror = () => { mainCover.src = fallbackCover; };
            audio.src = song.audioSrc;
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
            totalDurationEl.textContent = "0:00";

            renderPlaylist();

            const activeItem = playlistStrip.children[currentIndex];
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            if (autoPlay) {
                playAudio();
            } else {
                pauseAudio();
            }
        }

        function playAudio() {
            setupAudioAnalyser();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audio.play().then(() => {
                isPlaying = true;
                playPauseSvg.innerHTML = pauseIcon;
            }).catch(() => {
                isPlaying = false;
                playPauseSvg.innerHTML = playIcon;
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playPauseSvg.innerHTML = playIcon;
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) pauseAudio();
            else playAudio();
        });

        prevBtn.addEventListener('click', () => {
            const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(prevIndex, true);
        });

        nextBtn.addEventListener('click', () => {
            playNextTrack();
        });

        function playNextTrack() {
            if (isShuffle && playlist.length > 1) {
                let randIndex;
                do {
                    randIndex = Math.floor(Math.random() * playlist.length);
                } while (randIndex === currentIndex);
                loadSong(randIndex, true);
            } else {
                const nextIndex = (currentIndex + 1) % playlist.length;
                loadSong(nextIndex, true);
            }
        }

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        loopBtn.addEventListener('click', () => {
            isLoop = !isLoop;
            audio.loop = isLoop;
            loopBtn.classList.toggle('active', isLoop);
        });

        audio.addEventListener('loadedmetadata', () => {
            totalDurationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.volume = 0.85;
        volumeBar.addEventListener('input', () => {
            audio.muted = false;
            audio.volume = volumeBar.value / 100;
        });

        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            volumeBar.value = audio.muted ? 0 : audio.volume * 100;
        });

        audio.addEventListener('ended', () => {
            if (!isLoop) playNextTrack();
        });

        playlistStrip.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                playlistStrip.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        loadSong(0, false);
        drawWaveform();
    </script>
</body>
</html>
