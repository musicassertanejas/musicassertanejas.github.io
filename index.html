<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Músicas Sertanejas</title>
    <meta property="og:title" content="Músicas Sertanejas">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://musicassertanejas.github.io/">
    <meta property="og:image" content="https://musicassertanejas.github.io/logo.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-cyan-glow: rgba(0, 240, 255, 0.45);
            --amber-gold: #ffaa44;
            --text-main: #ffffff;
            --text-muted: #b89f8d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100dvh; overflow: hidden;
            background-color: #1c0e07;
            background-image: radial-gradient(circle at 50% 30%, #361c0f 0%, #241209 55%, #170b05 100%);
            color: var(--text-main); display: flex; align-items: center; justify-content: center; position: relative;
        }
        .player-shell {
            position: relative; z-index: 1; width: 100%; max-width: 430px; height: 100dvh; max-height: 860px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: clamp(12px, 2.5vh, 22px) 20px clamp(14px, 2.8vh, 24px);
        }
        @media (min-width: 520px) {
            .player-shell {
                height: 94dvh; border-radius: 28px; background: rgba(30, 15, 8, 0.78);
                border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
            }
        }
        .top-header { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2vh, 12px); flex-shrink: 0; }
        .site-logo {
            width: clamp(54px, 8.5vh, 74px); height: clamp(54px, 8.5vh, 74px); border-radius: 50%;
            object-fit: cover; border: 1.5px solid rgba(255, 255, 255, 0.35); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        }
        .site-title {
            font-size: clamp(1.1rem, 2.5vh, 1.35rem); font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; text-align: center; color: var(--text-main);
        }
        .featured-cover-box {
            width: clamp(150px, 25vh, 225px); height: clamp(150px, 25vh, 225px); aspect-ratio: 1 / 1;
            border-radius: 22px; overflow: hidden; border: 2px solid #ffffff;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65); flex-shrink: 0;
        }
        .featured-cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .track-info-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1vh, 10px); flex-shrink: 0; }
        .track-title {
            font-size: clamp(1.15rem, 2.6vh, 1.45rem); font-weight: 600; text-align: center; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        #waveCanvas { width: 100%; height: clamp(36px, 5.5vh, 52px); display: block; }
        .progress-area { width: 100%; flex-shrink: 0; }
        .time-labels {
            display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);
            margin-bottom: 6px; font-variant-numeric: tabular-nums;
        }
        input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 99px;
            background: rgba(255, 255, 255, 0.16); outline: none; cursor: pointer; display: block;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: transparent; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan); margin-top: -4.5px; transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .controls-row { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0; }
        .ctrl-btn {
            background: transparent; border: none; color: var(--text-muted); width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
        }
        .ctrl-btn:hover { color: #ffffff; }
        .ctrl-btn.nav-btn { color: #ffffff; }
        .ctrl-btn.nav-btn:active { transform: scale(0.9); opacity: 0.8; }
        .ctrl-btn.active { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); background: rgba(0, 240, 255, 0.12); }
        .play-main-btn {
            width: clamp(50px, 7vh, 60px); height: clamp(50px, 7vh, 60px); border-radius: 50%;
            background: transparent; border: none; color: #ffffff; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .play-main-btn:active { transform: scale(0.9); opacity: 0.8; }
        .volume-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 4px; flex-shrink: 0; }
        .vol-btn { background: transparent; border: none; color: #ffffff; display: flex; align-items: center; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { background: #ffffff !important; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6) !important; }
        .playlist-wrapper { width: 100%; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .playlist-strip {
            width: 100%; display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden;
            padding: 2px 2px 4px; scroll-behavior: smooth; scrollbar-width: none;
        }
        .playlist-strip::-webkit-scrollbar { display: none; }
        .custom-scroll-track {
            width: 100%; height: 4px; background: rgba(255, 255, 255, 0.08);
            border-radius: 10px; position: relative; overflow: hidden;
        }
        .custom-scroll-thumb {
            height: 100%; background: var(--amber-gold); border-radius: 10px;
            position: absolute; left: 0; top: 0; width: 32%; transition: width 0.2s ease;
        }
        .song-item { flex: 0 0 clamp(74px, 11vh, 88px); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .song-thumb {
            width: clamp(74px, 11vh, 88px); height: clamp(74px, 11vh, 88px); aspect-ratio: 1 / 1;
            border-radius: 14px; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.14); transition: all 0.2s ease;
        }
        .song-item.active .song-thumb { border-color: var(--neon-cyan); box-shadow: 0 0 14px var(--neon-cyan-glow); }
        .song-name {
            width: 100%; font-size: 0.72rem; color: var(--text-muted); text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .song-item.active .song-name { color: #ffffff; font-weight: 700; }
    </style>
</head>
<body>
    <main class="player-shell">
        <header class="top-header">
            <img src="logo.jpg" onerror="this.src=fallbackLogo" alt="Logo" class="site-logo">
            <h1 class="site-title">Músicas Sertanejas</h1>
        </header>
        <div class="featured-cover-box"><img id="mainCover" src="" alt="Capa da Música"></div>
        <section class="track-info-area">
            <div class="track-title" id="trackTitle">Carregando...</div>
            <canvas id="waveCanvas" width="640" height="90"></canvas>
        </section>
        <section class="progress-area">
            <div class="time-labels"><span id="currentTime">0:00</span><span id="totalDuration">0:00</span></div>
            <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
        </section>
        <section class="controls-row">
            <button class="ctrl-btn" id="shuffleBtn" title="Aleatório">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
            </button>
            <button class="ctrl-btn nav-btn" id="prevBtn" title="Anterior">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="play-main-btn" id="playPauseBtn" title="Tocar ou Pausar">
                <svg id="playPauseSvg" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn nav-btn" id="nextBtn" title="Próxima">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="ctrl-btn" id="loopBtn" title="Repetir Música">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
            </button>
        </section>
        <section class="volume-row">
            <button class="vol-btn" id="muteBtn" title="Mudo">
                <svg id="volSvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <input type="range" class="volume-slider" id="volumeBar" value="85" min="0" max="100">
        </section>
        <section class="playlist-wrapper">
            <div class="playlist-strip" id="playlistStrip"></div>
            <div class="custom-scroll-track" id="scrollTrack"><div class="custom-scroll-thumb" id="scrollThumb"></div></div>
        </section>
    </main>
    <audio id="audioPlayer" preload="auto"></audio>
    <script>
        const playlist = [
            { title: "A Pracinha", audioSrc: "musicas/musica1.mp3", coverSrc: "capas/capa1.jpg" },
            { title: "Eternidade", audioSrc: "musicas/musica2.mp3", coverSrc: "capas/capa2.jpg" },
            { title: "Volta pro Meu Abraço", audioSrc: "musicas/musica3.mp3", coverSrc: "capas/capa3.jpg" },
            { title: "Amor Proibido", audioSrc: "musicas/musica4.mp3", coverSrc: "capas/capa4.jpg" },
            { title: "Escolha", audioSrc: "musicas/musica5.mp3", coverSrc: "capas/capa5.jpg" },
            { title: "Teu Perfume", audioSrc: "musicas/musica6.mp3", coverSrc: "capas/capa6.jpg" }
        ];
        const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><circle cx='100' cy='100' r='96' fill='%231c0e07' stroke='%23ffffff' stroke-width='4'/><text x='100' y='108' font-family='sans-serif' font-size='24' font-weight='bold' fill='%23ffffff' text-anchor='middle'>IA MUSIC</text></svg>";
        const fallbackCover = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='%23241209'/><circle cx='150' cy='150' r='85' fill='none' stroke='%23ffffff' stroke-width='3'/><text x='150' y='156' font-family='sans-serif' font-size='20' fill='%23ffaa44' text-anchor='middle'>SERTANEJO</text></svg>";
        const audio = document.getElementById('audioPlayer'), mainCover = document.getElementById('mainCover'), trackTitle = document.getElementById('trackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn'), playPauseSvg = document.getElementById('playPauseSvg');
        const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'), shuffleBtn = document.getElementById('shuffleBtn'), loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar'), currentTimeEl = document.getElementById('currentTime'), totalDurationEl = document.getElementById('totalDuration');
        const playlistStrip = document.getElementById('playlistStrip'), scrollTrack = document.getElementById('scrollTrack'), scrollThumb = document.getElementById('scrollThumb');
        const volumeBar = document.getElementById('volumeBar'), muteBtn = document.getElementById('muteBtn');
        const canvas = document.getElementById('waveCanvas'), ctx = canvas.getContext('2d');
        let currentIndex = 0, isPlaying = false, isShuffle = false, isLoop = false;
        let audioCtx = null, analyser = null, dataArray = null, webAudioReady = false, phase = 0, smoothEnergy = 0;
        const playIcon = `<path d="M8 5v14l11-7z"/>`, pauseIcon = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;

        function updateSliderFill(slider, fillColor) {
            const min = parseFloat(slider.min) || 0, max = parseFloat(slider.max) || 100, val = parseFloat(slider.value) || 0;
            const pct = ((val - min) / (max - min)) * 100;
            slider.style.background = `linear-gradient(to right, ${fillColor} 0%, ${fillColor} ${pct}%, rgba(255, 255, 255, 0.16) ${pct}%, rgba(255, 255, 255, 0.16) 100%)`;
        }
        function updateCustomScrollbar() {
            const visibleW = playlistStrip.clientWidth, totalW = playlistStrip.scrollWidth;
            if (totalW <= visibleW) { scrollTrack.style.opacity = '0'; return; }
            scrollTrack.style.opacity = '1';
            const nativeRatio = visibleW / totalW;
            const thumbPct = Math.max(15, nativeRatio * 0.70 * 100);
            const maxScroll = totalW - visibleW;
            const scrollRatio = maxScroll > 0 ? playlistStrip.scrollLeft / maxScroll : 0;
            const leftPct = scrollRatio * (100 - thumbPct);
            scrollThumb.style.width = `${thumbPct}%`;
            scrollThumb.style.left = `${leftPct}%`;
        }
        playlistStrip.addEventListener('scroll', updateCustomScrollbar);
        window.addEventListener('resize', updateCustomScrollbar);

        function setupAudioAnalyser() {
            if (audioCtx) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                const source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.75;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                webAudioReady = true;
            } catch (e) { webAudioReady = false; }
        }
        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            const width = canvas.width, height = canvas.height, centerY = height / 2;
            ctx.clearRect(0, 0, width, height);
            const activelyPlaying = isPlaying && !audio.paused && !audio.ended;
            let targetEnergy = 0;
            if (activelyPlaying) {
                if (webAudioReady && analyser && dataArray) {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < 40; i++) sum += dataArray[i];
                    const avg = sum / (40 * 255);
                    targetEnergy = avg > 0.01 ? Math.min(1.1, avg * 1.8) : 0.45;
                } else { targetEnergy = 0.5 + Math.sin(phase * 0.8) * 0.25; }
            }
            smoothEnergy += (targetEnergy - smoothEnergy) * (activelyPlaying ? 0.22 : 0.18);
            if (activelyPlaying) phase += 0.09;
            const grad = ctx.createLinearGradient(0, 0, width, 0);
            grad.addColorStop(0, '#ffaa44'); grad.addColorStop(0.45, '#e89b52'); grad.addColorStop(0.65, '#4fd1c5'); grad.addColorStop(1, '#00f0ff');
            const layers = [
                { speed: 0.75, freq1: 0.022, freq2: 0.045, scale: 0.78, alphaFill: 0.18, alphaStroke: 0.45, lineW: 1.5 },
                { speed: 1.0,  freq1: 0.030, freq2: 0.062, scale: 1.0,  alphaFill: 0.34, alphaStroke: 0.95, lineW: 2.4 }
            ];
            layers.forEach(layer => {
                ctx.beginPath(); ctx.moveTo(0, centerY);
                const steps = 140, stepX = width / steps;
                for (let i = 0; i <= steps; i++) {
                    const x = i * stepX, normX = i / steps, envelope = Math.pow(Math.sin(normX * Math.PI), 1.6);
                    let dynamicMod = 1;
                    if (activelyPlaying && webAudioReady && dataArray) {
                        const binIdx = Math.min(dataArray.length - 1, Math.floor(normX * 48));
                        dynamicMod = 0.35 + (dataArray[binIdx] / 255) * 1.15;
                    }
                    const wave1 = Math.sin(x * layer.freq1 - phase * layer.speed), wave2 = Math.cos(x * layer.freq2 + phase * layer.speed * 1.3);
                    const combined = Math.abs(wave1 * 0.6 + wave2 * 0.4);
                    const amp = (1.2 + combined * (height * 0.45) * smoothEnergy * dynamicMod * layer.scale) * envelope;
                    ctx.lineTo(x, centerY - Math.max(0.8, amp));
                }
                for (let i = steps; i >= 0; i--) {
                    const x = i * stepX, normX = i / steps, envelope = Math.pow(Math.sin(normX * Math.PI), 1.6);
                    let dynamicMod = 1;
                    if (activelyPlaying && webAudioReady && dataArray) {
                        const binIdx = Math.min(dataArray.length - 1, Math.floor(normX * 48));
                        dynamicMod = 0.35 + (dataArray[binIdx] / 255) * 1.15;
                    }
                    const wave1 = Math.sin(x * layer.freq1 - phase * layer.speed), wave2 = Math.cos(x * layer.freq2 + phase * layer.speed * 1.3);
                    const combined = Math.abs(wave1 * 0.6 + wave2 * 0.4);
                    const amp = (1.2 + combined * (height * 0.45) * smoothEnergy * dynamicMod * layer.scale) * envelope;
                    ctx.lineTo(x, centerY + Math.max(0.8, amp));
                }
                ctx.closePath(); ctx.fillStyle = grad; ctx.globalAlpha = layer.alphaFill; ctx.fill();
                ctx.strokeStyle = grad; ctx.lineWidth = layer.lineW; ctx.shadowBlur = activelyPlaying ? 14 : 4;
                ctx.shadowColor = 'rgba(0, 240, 255, 0.5)'; ctx.globalAlpha = layer.alphaStroke; ctx.stroke();
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        }
        function formatTime(sec) {
            if (isNaN(sec) || !isFinite(sec)) return "0:00";
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        function updateMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title, artist: 'Músicas Sertanejas',
                    artwork: [{ src: new URL(song.coverSrc, window.location.href).href, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => playAudio());
                navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
                navigator.mediaSession.setActionHandler('previoustrack', () => handlePrevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack(true));
            }
        }
        function renderPlaylist() {
            playlistStrip.innerHTML = '';
            playlist.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<img src="${song.coverSrc}" onerror="this.src=fallbackCover" class="song-thumb" alt="${song.title}"><span class="song-name">${song.title}</span>`;
                item.addEventListener('click', () => loadSong(idx, true));
                playlistStrip.appendChild(item);
            });
            setTimeout(updateCustomScrollbar, 50);
        }
        function loadSong(index, autoPlay = false) {
            currentIndex = index;
            const song = playlist[currentIndex];
            trackTitle.textContent = song.title;
            mainCover.src = song.coverSrc;
            mainCover.onerror = () => { mainCover.src = fallbackCover; };
            audio.src = song.audioSrc;
            audio.load();
            progressBar.value = 0; updateSliderFill(progressBar, '#00f0ff');
            currentTimeEl.textContent = "0:00"; totalDurationEl.textContent = "0:00";
            renderPlaylist(); updateMediaSession(song);
            const activeItem = playlistStrip.children[currentIndex];
            if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            if (autoPlay) playAudio(); else pauseAudio();
        }
        function playAudio() {
            setupAudioAnalyser();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true; playPauseSvg.innerHTML = pauseIcon;
                    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                }).catch(() => { isPlaying = false; playPauseSvg.innerHTML = playIcon; });
            }
        }
        function pauseAudio() {
            audio.pause(); isPlaying = false; playPauseSvg.innerHTML = playIcon;
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }
        playPauseBtn.addEventListener('click', () => { if (isPlaying) pauseAudio(); else playAudio(); });
        function handlePrevTrack() {
            const shouldAutoPlay = isPlaying;
            const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(prevIndex, shouldAutoPlay);
        }
        function playNextTrack(forceAutoPlay = null) {
            const shouldAutoPlay = forceAutoPlay !== null ? forceAutoPlay : isPlaying;
            if (isShuffle && playlist.length > 1) {
                let randIndex;
                do { randIndex = Math.floor(Math.random() * playlist.length); } while (randIndex === currentIndex);
                loadSong(randIndex, shouldAutoPlay);
            } else {
                const nextIndex = (currentIndex + 1) % playlist.length;
                loadSong(nextIndex, shouldAutoPlay);
            }
        }
        prevBtn.addEventListener('click', handlePrevTrack);
        nextBtn.addEventListener('click', () => playNextTrack());
        shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; shuffleBtn.classList.toggle('active', isShuffle); });
        loopBtn.addEventListener('click', () => { isLoop = !isLoop; audio.loop = isLoop; loopBtn.classList.toggle('active', isLoop); });
        audio.addEventListener('loadedmetadata', () => { totalDurationEl.textContent = formatTime(audio.duration); });
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                updateSliderFill(progressBar, '#00f0ff');
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        });
        progressBar.addEventListener('input', () => {
            updateSliderFill(progressBar, '#00f0ff');
            if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
        });
        audio.volume = 0.85; updateSliderFill(volumeBar, '#ffffff');
        volumeBar.addEventListener('input', () => { audio.muted = false; audio.volume = volumeBar.value / 100; updateSliderFill(volumeBar, '#ffffff'); });
        muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; volumeBar.value = audio.muted ? 0 : audio.volume * 100; updateSliderFill(volumeBar, '#ffffff'); });
        audio.addEventListener('ended', () => {
            isPlaying = false; playPauseSvg.innerHTML = playIcon;
            if (!isLoop) playNextTrack(true);
        });
        playlistStrip.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) { e.preventDefault(); playlistStrip.scrollLeft += e.deltaY; }
        }, { passive: false });
        loadSong(0, false); drawWaveform();
    </script>
</body>
</html>
